<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>เกมโยงเส้นจับคู่แคว้นโบราณ</title>

<style>

/* ===============================
   🎨 พื้นฐาน
================================ */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: auto;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  color: #3d2b1f;

  background:
    radial-gradient(circle at top left, rgba(255,220,130,.55), transparent 35%),
    radial-gradient(circle at bottom right, rgba(160,110,55,.22), transparent 40%),
    linear-gradient(135deg, #e7d2a0, #f8edcf, #d9bd7c);

  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 1900px;
  margin: auto;
  padding: 25px;
}

.card {
  background: linear-gradient(
    135deg,
    rgba(255,252,237,.97),
    rgba(245,232,195,.97)
  );

  border: 3px solid #b8904b;
  border-radius: 28px;
  padding: 30px;

  box-shadow:
    0 12px 35px rgba(70,40,15,.28),
    inset 0 0 35px rgba(160,110,45,.12);
}

/* ===============================
   🏛️ หน้าเริ่มต้น
================================ */

#startPage {
  max-width: 650px;
  margin: 50px auto;
}

.main-title {
  text-align: center;
  font-size: 38px;
  color: #68401d;
  margin: 0 0 10px;
}

.subtitle {
  text-align: center;
  color: #765d43;
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 30px;
}

input {
  width: 100%;
  padding: 16px 18px;
  margin-bottom: 15px;

  border: 2px solid #c6a45d;
  border-radius: 14px;

  background: #fffdf4;
  font-size: 18px;
}

/* ===============================
   🔘 ปุ่ม
================================ */

button {
  border: none;
  border-radius: 14px;
  padding: 16px 20px;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;
}

.primary-btn {
  width: 100%;
  background: linear-gradient(135deg, #7b4f27, #a87532);
  color: white;
}

/* ===============================
   🎮 หน้าเกม
================================ */

.game-page,
.result-page {
  display: none;
}

.game-header {
  text-align: center;
  margin-bottom: 20px;
}

.game-title {
  margin: 0;
  font-size: 38px;
  color: #68401d;
}

.part-badge {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 22px;

  border-radius: 30px;

  background: #7b4f27;
  color: white;

  font-weight: bold;
  font-size: 18px;
}

/* ===============================
   📊 แถบข้อมูล
================================ */

.top-bar {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin: 25px 0;
}

.info-box {
  flex: 1;
  text-align: center;

  padding: 17px;
  border-radius: 18px;

  background: #fff8df;
  border: 2px solid #d0ad64;

  font-size: 19px;
  font-weight: bold;
}

/* ===============================
   💡 คำแนะนำ
================================ */

.instructions {
  text-align: center;

  padding: 20px;
  margin-bottom: 25px;

  border-radius: 20px;

  background: #edf3e8;
  border: 2px solid #9cac91;

  font-size: 18px;
  line-height: 1.8;
}

/* ===============================
   🗺️ กระดานเกม
================================ */

.game-board {
  position: relative;

  display: grid;

  grid-template-columns:
    minmax(250px, 1fr)
    570px
    minmax(250px, 1fr);

  width: 100%;
  min-height: 900px;

  margin-top: 15px;
}

/* ===============================
   ➖ SVG
================================ */

#svgLines {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  z-index: 5;

  pointer-events: none;
  overflow: visible;
}

/* ===============================
   🏛️ คอลัมน์
================================ */

.column {
  position: relative;
  z-index: 10;
}

.left-column {
  grid-column: 1;
}

.right-column {
  grid-column: 3;
}

.column h2 {
  text-align: center;
  font-size: 27px;
  color: #68401d;
  margin: 10px 0 30px;
}

/* ===============================
   📋 รายการ
================================ */

#kingdomList {
  height: 780px;

  display: flex;
  flex-direction: column;

  justify-content: space-between;
}

#answerList {
  height: 780px;

  display: flex;
  flex-direction: column;

  justify-content: space-between;
}

/* ===============================
   🏛️ กล่องแคว้น
================================ */

.item {
  position: relative;

  min-height: 80px;

  display: flex;
  align-items: center;

  padding:
    18px
    60px
    18px
    25px;

  border-radius: 20px;

  font-size: 20px;
  font-weight: bold;

  background: linear-gradient(
    135deg,
    #c8d5dc,
    #e4edf0
  );

  border: 2px solid #9aabb1;

  color: #34444c;

  box-shadow:
    0 7px 15px rgba(40,55,60,.18);
}

/* ===============================
   🏺 กล่องคำตอบ
================================ */

.answer-item {
  padding:
    15px
    25px
    15px
    60px;

  font-size: 17px;

  background: linear-gradient(
    135deg,
    #f7dfa0,
    #fff6d8
  );

  border-color: #d1aa4e;

  color: #65431d;
}

/* ===============================
   🔵 🟡 จุดโยง
================================ */

.connector {
  position: absolute;

  width: 40px;
  height: 40px;

  border-radius: 50%;

  top: 50%;
  transform: translateY(-50%);

  border: 5px solid #fffdf3;

  box-shadow: 0 4px 10px rgba(0,0,0,.3);

  z-index: 30;

  cursor: crosshair;

  touch-action: pan-y;
}

.left-dot {
  right: -20px;

  background: radial-gradient(
    circle at 35% 30%,
    #70b5df,
    #17618f
  );
}

.right-dot {
  left: -20px;

  background: radial-gradient(
    circle at 35% 30%,
    #ffd85d,
    #c58300
  );
}

/* ===============================
   ➖ เส้น
================================ */

.line {
  stroke: #b8482f;
  stroke-width: 7;
  stroke-linecap: round;

  filter: drop-shadow(
    0 3px 2px rgba(60,20,10,.25)
  );
}

.temp-line {
  stroke: #72512f;
  stroke-width: 6;

  stroke-linecap: round;

  stroke-dasharray: 14 9;

  opacity: .85;
}

.item.connected {
  box-shadow:
    0 0 0 4px rgba(86,138,84,.28),
    0 7px 15px rgba(40,55,60,.18);
}

/* ===============================
   🎮 ปุ่มควบคุม
================================ */

.controls {
  display: flex;
  gap: 15px;
  margin-top: 30px;
}

.controls button {
  flex: 1;
}

.undo-btn {
  background: #f1c45c;
  color: #493117;
}

.clear-btn {
  background: #d95c4c;
  color: white;
}

.next-btn,
.submit-btn {
  background: #79a567;
  color: white;
}

/* ===============================
   🏆 ผลคะแนน
================================ */

.result-page {
  max-width: 700px;
  margin: 50px auto;
  text-align: center;
}

.score {
  font-size: 58px;
  font-weight: bold;
  color: #a56817;
  margin: 25px 0;
}

.result-info {
  font-size: 20px;
  line-height: 1.8;
}

/* ===============================
   📱 Responsive
================================ */

@media (max-width: 1400px) {

  .game-board {
    grid-template-columns:
      minmax(220px, 1fr)
      400px
      minmax(220px, 1fr);
  }

}

@media (max-width: 700px) {

  .container {
    padding: 6px;
  }

  .card {
    padding: 12px;
    border-radius: 18px;
  }

  .main-title,
  .game-title {
    font-size: 25px;
  }

  .top-bar {
    flex-direction: column;
    gap: 10px;
  }

  .info-box {
    font-size: 16px;
    padding: 12px;
  }

  .instructions {
    font-size: 14px;
    padding: 14px;
  }

  .game-board {

    grid-template-columns:
      42%
      16%
      42%;

    min-height: 760px;
  }

  #kingdomList,
  #answerList {
    height: 680px;
  }

  .column h2 {
    font-size: 17px;
    margin-bottom: 20px;
  }

  .item {

    min-height: 65px;

    font-size: 12px;

    padding:
      8px
      28px
      8px
      7px;
  }

  .answer-item {
    font-size: 11px;
    padding-left: 28px;
  }

  .connector {
    width: 34px;
    height: 34px;
    border-width: 4px;
  }

  .left-dot {
    right: -17px;
  }

  .right-dot {
    left: -17px;
  }

  .controls {
    flex-direction: column;
  }

  .line {
    stroke-width: 5;
  }

}

body.dragging {
  user-select: none;
  -webkit-user-select: none;
}

</style>
</head>


<body>

<script>

/* ===============================
   📊 Google Sheets
================================ */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn1YvetTuJpB8zmcdUhspvxBMR1JOBO-dsHHCDhfxMbbeIIZF-VEGQGpH6kCoW5pn4OA/exec";


/* ===============================
   🏛️ ข้อมูลแคว้น
================================ */

const kingdoms = [

"ทวารวดี",
"ละโว้",
"ลังกาสุกะ",
"ศรีวิชัย",
"ตามพรลิงค์",

"หริภุญชัย"

];


/* ===============================
   🏛️ PART 1
   สถานที่สำคัญ
================================ */

const part1 = {

title:
"🏛️ พาร์ทที่ 1 : จับคู่แคว้นกับสถานที่สำคัญ",

rightTitle:
"📍 สถานที่สำคัญ",

answers: [

"ธรรมจักรศิลากับกวางหมอบ",
"พระปรางค์สามยอด",
"เมืองโบราณบ้านจาเละ",
"พระบรมธาตุไชยา",
"พระบรมธาตุเจดีย์ จังหวัดนครศรีธรรมราช",
"พระธาตุพนม",
"วัดจามเทวี"

],

correct: {

"ทวารวดี":
"ธรรมจักรศิลากับกวางหมอบ",

"ละโว้":
"พระปรางค์สามยอด",

"ลังกาสุกะ":
"เมืองโบราณบ้านจาเละ",

"ศรีวิชัย":
"พระบรมธาตุไชยา",

"ตามพรลิงค์":
"พระบรมธาตุเจดีย์ จังหวัดนครศรีธรรมราช",

"โคตรบูรณ์":
"พระธาตุพนม",

"หริภุญชัย":
"วัดจามเทวี"

}

};


/* ===============================
   📍 PART 2
   ศูนย์กลางอาณาจักร
================================ */

const part2 = {

title:
"📍 พาร์ทที่ 2 : จับคู่แคว้นกับศูนย์กลางอาณาจักร",

rightTitle:
"🗺️ ศูนย์กลางอาณาจักร",

answers: [

"จังหวัดนครปฐม",
"จังหวัดลพบุรี",
"จังหวัดปัตตานี",
"จังหวัดสุราษฎร์ธานี",
"จังหวัดนครศรีธรรมราช",
"จังหวัดนครพนม",
"จังหวัดลำพูน"

],

correct: {

"ทวารวดี":
"จังหวัดนครปฐม",

"ละโว้":
"จังหวัดลพบุรี",

"ลังกาสุกะ":
"จังหวัดปัตตานี",

"ศรีวิชัย":
"จังหวัดสุราษฎร์ธานี",

"ตามพรลิงค์":
"จังหวัดนครศรีธรรมราช",

"โคตรบูรณ์":
"จังหวัดนครพนม",

"หริภุญชัย":
"จังหวัดลำพูน"

}

};


/* ===============================
   🎮 ตัวแปรเกม
================================ */

let currentPart = 1;

let connections = [];

let part1Connections = [];
let part2Connections = [];

let startKingdom = null;

let isDragging = false;

let tempLine = null;

let activePointerId = null;

let seconds = 0;

let timerInterval = null;

let lastPointerX = 0;
let lastPointerY = 0;

let autoScrollAnimation = null;
let autoScrollDirection = 0;


/* ===============================
   🔀 สุ่มคำตอบ
================================ */

function shuffle(array) {

  const newArray = [...array];

  for (
    let i = newArray.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [newArray[i], newArray[j]] =
    [newArray[j], newArray[i]];

  }

  return newArray;

}


/* ===============================
   ▶️ เริ่มเกม
================================ */

function startGame() {

  const name =
    document.getElementById("studentName")
    .value.trim();

  const classroom =
    document.getElementById("studentClass")
    .value.trim();

  const number =
    document.getElementById("studentNumber")
    .value.trim();


  if (!name || !classroom || !number) {

    alert(
      "⚠️ กรุณากรอกชื่อ ชั้น และเลขที่ให้ครบ"
    );

    return;

  }


  document.getElementById("startPage")
    .style.display = "none";

  document.getElementById("gamePage")
    .style.display = "block";


  loadPart(1);


  timerInterval = setInterval(() => {

    seconds++;
    updateTimer();

  }, 1000);

}


/* ===============================
   📖 โหลดพาร์ท
================================ */

function loadPart(partNumber) {

  currentPart = partNumber;

  connections = [];


  const data =
    currentPart === 1
    ? part1
    : part2;


  document.getElementById("partTitle")
    .textContent = data.title;


  document.getElementById("rightTitle")
    .textContent = data.rightTitle;


  document.getElementById("instructions")
    .innerHTML =

    currentPart === 1

    ?

    `
    🔵 ลากจาก <b>แคว้น</b>
    ไปยัง 🟡 <b>สถานที่สำคัญ</b> ที่ถูกต้อง<br>
    ✨ ทำให้ครบทั้ง 7 ข้อ แล้วไปต่อพาร์ทที่ 2
    `

    :

    `
    🔵 ลากจาก <b>แคว้น</b>
    ไปยัง 🟡 <b>ศูนย์กลางอาณาจักร</b> ที่ถูกต้อง<br>
    🏆 ทำครบทั้ง 7 ข้อ แล้วตรวจคำตอบและส่งคะแนน
    `;


  document.getElementById("progress")
    .textContent = "0";


  document.getElementById("nextButton")
    .textContent =

    currentPart === 1

    ? "➡️ ไปพาร์ทที่ 2"

    : "🏆 ตรวจคำตอบและส่งคะแนน";


  renderGame(data);

  window.scrollTo(0, 0);

}


/* ===============================
   🏗️ สร้างเกม
================================ */

function renderGame(data) {

  const kingdomList =
    document.getElementById("kingdomList");

  const answerList =
    document.getElementById("answerList");

  const svg =
    document.getElementById("svgLines");


  kingdomList.innerHTML = "";
  answerList.innerHTML = "";
  svg.innerHTML = "";


  /* ฝั่งซ้าย */

  kingdoms.forEach(kingdom => {

    const item =
      document.createElement("div");

    item.className = "item";

    item.dataset.kingdomItem =
      kingdom;

    item.innerHTML = `

      🏛️ แคว้น${kingdom}

      <div
        class="connector left-dot"
        data-kingdom="${kingdom}">
      </div>

    `;

    kingdomList.appendChild(item);

  });


  /* ฝั่งขวา */

  const shuffledAnswers =
    shuffle(data.answers);


  shuffledAnswers.forEach(answer => {

    const item =
      document.createElement("div");

    item.className =
      "item answer-item";

    item.dataset.answerItem =
      answer;

    item.innerHTML = `

      <div
        class="connector right-dot"
        data-answer="${answer}">
      </div>

      ${answer}

    `;

    answerList.appendChild(item);

  });


  setupConnectors();

}


/* ===============================
   🔗 จุดโยง
================================ */

function setupConnectors() {

  document
  .querySelectorAll(".left-dot")
  .forEach(dot => {

    dot.addEventListener(
      "pointerdown",
      startConnection
    );

  });

}


/* ===============================
   🔵 เริ่มลาก
================================ */

function startConnection(event) {

  if (
    event.pointerType === "mouse" &&
    event.button !== 0
  ) return;


  event.preventDefault();


  startKingdom =
    event.currentTarget.dataset.kingdom;


  /* ห้ามโยงแคว้นเดิมซ้ำ */

  const alreadyConnected =
    connections.some(
      c => c.kingdom === startKingdom
    );


  if (alreadyConnected) {

    alert(
      "⚠️ แคว้นนี้ถูกโยงแล้ว"
    );

    startKingdom = null;

    return;

  }


  isDragging = true;

  activePointerId =
    event.pointerId;

  lastPointerX =
    event.clientX;

  lastPointerY =
    event.clientY;


  document.body.classList.add("dragging");


  const svg =
    document.getElementById("svgLines");


  tempLine =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );


  tempLine.setAttribute(
    "class",
    "temp-line"
  );


  svg.appendChild(tempLine);


  const point =
    getPoint(event.currentTarget);


  tempLine.setAttribute(
    "x1",
    point.x
  );

  tempLine.setAttribute(
    "y1",
    point.y
  );

  tempLine.setAttribute(
    "x2",
    point.x
  );

  tempLine.setAttribute(
    "y2",
    point.y
  );


  startAutoScroll();

}


/* ===============================
   🖐️ ขณะลาก
================================ */

document.addEventListener(
  "pointermove",
  moveConnection,
  { passive: false }
);


function moveConnection(event) {

  if (!isDragging) return;

  if (
    event.pointerId !== activePointerId
  ) return;


  lastPointerX =
    event.clientX;

  lastPointerY =
    event.clientY;


  updateTempLine();

  updateAutoScrollDirection();

}


/* ===============================
   ➖ อัปเดตเส้น
================================ */

function updateTempLine() {

  if (!tempLine) return;


  const board =
    document.getElementById("gameBoard");

  const boardRect =
    board.getBoundingClientRect();


  const startDot =
    document.querySelector(
      `.left-dot[data-kingdom="${startKingdom}"]`
    );


  if (!startDot) return;


  const startPoint =
    getPoint(startDot);


  tempLine.setAttribute(
    "x1",
    startPoint.x
  );

  tempLine.setAttribute(
    "y1",
    startPoint.y
  );

  tempLine.setAttribute(
    "x2",
    lastPointerX - boardRect.left
  );

  tempLine.setAttribute(
    "y2",
    lastPointerY - boardRect.top
  );

}


/* ===============================
   📱 AUTO SCROLL
================================ */

function updateAutoScrollDirection() {

  const zone = 100;


  if (
    lastPointerY >
    window.innerHeight - zone
  ) {

    autoScrollDirection = 1;

  }

  else if (
    lastPointerY < zone
  ) {

    autoScrollDirection = -1;

  }

  else {

    autoScrollDirection = 0;

  }

}


function startAutoScroll() {

  if (autoScrollAnimation) return;


  function scrollLoop() {

    if (!isDragging) {

      autoScrollAnimation = null;

      return;

    }


    if (autoScrollDirection !== 0) {

      window.scrollBy(
        0,
        10 * autoScrollDirection
      );

      requestAnimationFrame(() => {
        updateTempLine();
      });

    }


    autoScrollAnimation =
      requestAnimationFrame(scrollLoop);

  }


  autoScrollAnimation =
    requestAnimationFrame(scrollLoop);

}


/* ===============================
   🟡 ปล่อยนิ้ว
================================ */

document.addEventListener(
  "pointerup",
  finishConnection
);


function finishConnection(event) {

  if (!isDragging) return;

  if (
    event.pointerId !== activePointerId
  ) return;


  autoScrollDirection = 0;


  const element =
    document.elementFromPoint(
      event.clientX,
      event.clientY
    );


  let answerDot = null;


  if (element) {

    if (
      element.classList &&
      element.classList.contains("right-dot")
    ) {

      answerDot = element;

    }

    else {

      const answerItem =
        element.closest(".answer-item");


      if (answerItem) {

        answerDot =
          answerItem.querySelector(".right-dot");

      }

    }

  }


  if (!answerDot) {

    cancelConnection();

    return;

  }


  const answer =
    answerDot.dataset.answer;


  const alreadyUsed =
    connections.some(
      c => c.answer === answer
    );


  if (alreadyUsed) {

    alert(
      "⚠️ คำตอบนี้ถูกใช้ไปแล้ว"
    );

    cancelConnection();

    return;

  }


  connections.push({

    kingdom: startKingdom,
    answer: answer

  });


  cancelConnection();

  drawLines();

  updateProgress();

  updateConnectedStatus();

}


/* ===============================
   ❌ ยกเลิก
================================ */

document.addEventListener(
  "pointercancel",
  cancelConnection
);


function cancelConnection() {

  if (tempLine) {

    tempLine.remove();
    tempLine = null;

  }


  isDragging = false;

  startKingdom = null;

  activePointerId = null;

  autoScrollDirection = 0;


  document.body.classList.remove(
    "dragging"
  );

}


/* ===============================
   📍 หาตำแหน่ง
================================ */

function getPoint(element) {

  const board =
    document.getElementById("gameBoard");

  const boardRect =
    board.getBoundingClientRect();

  const rect =
    element.getBoundingClientRect();


  return {

    x:
      rect.left -
      boardRect.left +
      rect.width / 2,

    y:
      rect.top -
      boardRect.top +
      rect.height / 2

  };

}


/* ===============================
   ✏️ วาดเส้น
================================ */

function drawLines() {

  const svg =
    document.getElementById("svgLines");


  svg.innerHTML = "";


  connections.forEach(connection => {

    const startDot =
      document.querySelector(
        `.left-dot[data-kingdom="${connection.kingdom}"]`
      );


    const endDot =
      document.querySelector(
        `.right-dot[data-answer="${connection.answer}"]`
      );


    if (!startDot || !endDot) return;


    const startPoint =
      getPoint(startDot);

    const endPoint =
      getPoint(endDot);


    const line =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );


    line.setAttribute(
      "x1",
      startPoint.x
    );

    line.setAttribute(
      "y1",
      startPoint.y
    );

    line.setAttribute(
      "x2",
      endPoint.x
    );

    line.setAttribute(
      "y2",
      endPoint.y
    );


    line.setAttribute(
      "class",
      "line"
    );


    svg.appendChild(line);

  });

}


/* ===============================
   🎯 สถานะ
================================ */

function updateConnectedStatus() {

  document
  .querySelectorAll(".item")
  .forEach(item => {

    item.classList.remove("connected");

  });


  connections.forEach(connection => {

    const kingdomItem =
      document.querySelector(
        `[data-kingdom-item="${connection.kingdom}"]`
      );


    const answerItem =
      document.querySelector(
        `[data-answer-item="${connection.answer}"]`
      );


    if (kingdomItem) {

      kingdomItem.classList.add("connected");

    }


    if (answerItem) {

      answerItem.classList.add("connected");

    }

  });

}


/* ===============================
   📊 ความคืบหน้า
================================ */

function updateProgress() {

  document
  .getElementById("progress")
  .textContent =
    connections.length;

}


/* ===============================
   ↩️ ย้อนกลับ
================================ */

function undoLast() {

  if (connections.length === 0) {

    alert("ยังไม่มีเส้นให้ย้อนกลับ");

    return;

  }


  connections.pop();

  drawLines();

  updateProgress();

  updateConnectedStatus();

}


/* ===============================
   🗑️ ล้าง
================================ */

function clearLines() {

  if (connections.length === 0) return;


  if (
    !confirm(
      "ต้องการล้างเส้นทั้งหมดใช่หรือไม่?"
    )
  ) return;


  connections = [];

  drawLines();

  updateProgress();

  updateConnectedStatus();

}


/* ===============================
   ➡️ ไปพาร์ทต่อไป
================================ */

function nextPart() {

  if (connections.length !== 7) {

    alert(
      "⚠️ กรุณาโยงเส้นให้ครบทั้ง 7 ข้อก่อน\n\n" +
      "ตอนนี้โยงแล้ว " +
      connections.length +
      " / 7"
    );

    return;

  }


  if (currentPart === 1) {

    /* เก็บคำตอบพาร์ท 1 */

    part1Connections =
      [...connections];


    /* โหลดพาร์ท 2 */

    loadPart(2);

    return;

  }


  /* เก็บคำตอบพาร์ท 2 */

  part2Connections =
    [...connections];


  submitGame();

}


/* ===============================
   ⏱️ เวลา
================================ */

function updateTimer() {

  const minutes =
    String(Math.floor(seconds / 60))
    .padStart(2, "0");


  const secs =
    String(seconds % 60)
    .padStart(2, "0");


  document.getElementById("timer")
    .textContent =
    minutes + ":" + secs;

}


/* ===============================
   🏆 ตรวจคำตอบ
================================ */

function submitGame() {

  clearInterval(timerInterval);


  let part1Score = 0;
  let part2Score = 0;


  /* PART 1 */

  part1Connections.forEach(connection => {

    if (
      part1.correct[connection.kingdom] ===
      connection.answer
    ) {

      part1Score++;

    }

  });


  /* PART 2 */

  part2Connections.forEach(connection => {

    if (
      part2.correct[connection.kingdom] ===
      connection.answer
    ) {

      part2Score++;

    }

  });


  const totalScore =
    part1Score +
    part2Score;


  const minutes =
    String(Math.floor(seconds / 60))
    .padStart(2, "0");


  const secs =
    String(seconds % 60)
    .padStart(2, "0");


  const time =
    minutes + ":" + secs;


  document.getElementById("gamePage")
    .style.display = "none";


  document.getElementById("resultPage")
    .style.display = "block";


  document.getElementById("resultName")
    .textContent =
    "👤 " +
    document.getElementById("studentName")
    .value;


  document.getElementById("scoreText")
    .textContent =
    totalScore +
    " / 14 คะแนน";


  document.getElementById("partScoreText")
    .innerHTML =
    "🏛️ พาร์ทที่ 1: <b>" +
    part1Score +
    " / 7</b><br>" +

    "📍 พาร์ทที่ 2: <b>" +
    part2Score +
    " / 7</b>";


  document.getElementById("timeText")
    .textContent =
    "⏱️ ใช้เวลาทั้งหมด " +
    time;


  sendToGoogleSheet(
    totalScore,
    part1Score,
    part2Score,
    time
  );

}


/* ===============================
   📤 ส่ง Google Sheets
================================ */

function sendToGoogleSheet(
  totalScore,
  part1Score,
  part2Score,
  time
) {

  const data = {

    name:
      document.getElementById("studentName").value,

    classroom:
      document.getElementById("studentClass").value,

    number:
      document.getElementById("studentNumber").value,

    part1Score:
      part1Score,

    part2Score:
      part2Score,

    score:
      totalScore,

    total:
      14,

    time:
      time

  };


  fetch(
    GOOGLE_SCRIPT_URL,
    {

      method: "POST",

      mode: "no-cors",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(data)

    }
  )

  .then(() => {

    document
    .getElementById("saveStatus")
    .textContent =
      "✅ ส่งคะแนนเรียบร้อยแล้ว";

  })

  .catch(() => {

    document
    .getElementById("saveStatus")
    .textContent =
      "⚠️ ไม่สามารถส่งคะแนนได้";

  });

}


/* ===============================
   📱 ปรับเส้นเมื่อเลื่อนจอ
================================ */

window.addEventListener(
  "resize",
  () => {

    if (connections.length > 0) {

      drawLines();

    }

  }
);


window.addEventListener(
  "scroll",
  () => {

    if (connections.length > 0) {

      drawLines();

    }


    if (isDragging) {

      updateTempLine();

    }

  },
  { passive: true }
);

</script>
