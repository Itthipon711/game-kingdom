<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>เกมโยงเส้นจับคู่แคว้นโบราณ</title>

<style>

/* =========================
   ตั้งค่าพื้นฐาน
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background:
    linear-gradient(135deg, #fff4c9, #e5f1df);
  color: #333;
}

.container {
  max-width: 1300px;
  margin: auto;
  padding: 20px;
}


/* =========================
   กล่องหลัก
========================= */

.card {
  background: #ffffff;
  border-radius: 25px;
  padding: 25px;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.12);
}


/* =========================
   หน้าเริ่มต้น
========================= */

#startPage {
  max-width: 600px;
  margin: 50px auto;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 15px;
  margin-bottom: 12px;

  border: 2px solid #ddd;
  border-radius: 12px;

  font-size: 17px;
}

input:focus {
  outline: none;
  border-color: #4f7d45;
}


/* =========================
   ปุ่ม
========================= */

button {
  border: none;
  border-radius: 12px;

  padding: 15px 20px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;
}

.primary-btn {
  width: 100%;
  background: #4f7d45;
  color: white;
}

.primary-btn:hover {
  opacity: 0.9;
}


/* =========================
   หน้าเกม
========================= */

.game-page,
.result-page {
  display: none;
}

.game-title {
  text-align: center;
}


/* =========================
   แถบข้อมูล
========================= */

.top-bar {

  display: flex;
  justify-content: space-between;

  gap: 15px;

  margin-bottom: 20px;

}

.info-box {

  background: #fff3cd;

  padding: 15px 22px;

  border-radius: 15px;

  font-weight: bold;

  font-size: 18px;

}


/* =========================
   คำแนะนำ
========================= */

.instructions {

  text-align: center;

  background: #dceaf7;

  padding: 18px;

  border-radius: 15px;

  margin-bottom: 30px;

  font-size: 17px;

  line-height: 1.7;

}


/* =========================
   กระดานเกม
========================= */

.game-board {

  position: relative;

  display: grid;

  grid-template-columns:
  minmax(280px, 1fr)
  minmax(350px, 1.2fr);

  gap: 70px;

  min-height: 850px;

}


/* SVG สำหรับวาดเส้น */

#svgLines {

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  z-index: 1;

  pointer-events: none;

}


/* คอลัมน์ */

.column {

  position: relative;

  z-index: 2;

}

.column h2 {

  text-align: center;

  margin-bottom: 25px;

}


/* =========================
   กล่องแคว้นและคำตอบ
========================= */

.item {

  position: relative;

  background: #dce9f5;

  border-radius: 16px;

  padding: 18px 45px 18px 20px;

  margin-bottom: 16px;

  min-height: 72px;

  display: flex;

  align-items: center;

  font-size: 17px;

  font-weight: bold;

  box-shadow:
  0 4px 10px rgba(0,0,0,0.10);

}

.answer-item {

  background: #fff3cc;

  padding:
  18px 20px 18px 45px;

}


/* =========================
   จุดสำหรับโยงเส้น
========================= */

.connector {

  position: absolute;

  width: 28px;
  height: 28px;

  border-radius: 50%;

  top: 50%;

  transform:
  translateY(-50%);

  border: 4px solid white;

  box-shadow:
  0 3px 8px rgba(0,0,0,0.3);

  cursor: grab;

  z-index: 10;

  touch-action: none;

}

.connector:active {
  cursor: grabbing;
}


/* จุดฝั่งซ้าย */

.left-dot {

  right: -14px;

  background: #2875a8;

}


/* จุดฝั่งขวา */

.right-dot {

  left: -14px;

  background: #e3a400;

}


/* =========================
   เส้นโยง
========================= */

.line {

  stroke: #e0523d;

  stroke-width: 5;

  stroke-linecap: round;

}

.temp-line {

  stroke: #666;

  stroke-width: 4;

  stroke-dasharray: 10 7;

  stroke-linecap: round;

}


/* =========================
   ปุ่มด้านล่าง
========================= */

.controls {

  display: flex;

  gap: 15px;

  margin-top: 25px;

}

.controls button {

  flex: 1;

}

.clear-btn {

  background: #dc4c4c;

  color: white;

}

.submit-btn {

  background: #4f7d45;

  color: white;

}


/* =========================
   หน้าผลคะแนน
========================= */

.result-page {

  max-width: 650px;

  margin: 40px auto;

  text-align: center;

}

.score {

  font-size: 48px;

  font-weight: bold;

  margin: 25px 0;

}


/* =========================
   มือถือ / iPad
========================= */

@media (max-width: 800px) {

  .container {
    padding: 10px;
  }

  .card {
    padding: 18px;
  }

  .top-bar {
    gap: 10px;
  }

  .info-box {
    font-size: 15px;
    padding: 12px;
  }

  .game-board {

    grid-template-columns:
    minmax(150px, 1fr)
    minmax(180px, 1.2fr);

    gap: 45px;

    min-height: 1050px;

  }

  .item {

    font-size: 14px;

    min-height: 72px;

    padding-left: 12px;

  }

  .answer-item {

    padding-left: 35px;

  }

  .connector {

    width: 26px;
    height: 26px;

  }

  .left-dot {
    right: -13px;
  }

  .right-dot {
    left: -13px;
  }

  .controls {

    flex-direction: column;

  }

}

</style>
</head>


<body>

<div class="container">


<!-- =========================
     หน้าเริ่มเกม
========================= -->

<div class="card" id="startPage">

<h1>
🏛️ เกมโยงเส้นจับคู่แคว้นโบราณ
</h1>

<p class="subtitle">

จับคู่แคว้นโบราณกับหลักฐาน
และจังหวัดที่เกี่ยวข้องให้ถูกต้อง

</p>


<input
id="studentName"
placeholder="👤 ชื่อ-นามสกุล"
>


<input
id="studentClass"
placeholder="🏫 ชั้น เช่น ม.1/1"
>


<input
id="studentNumber"
placeholder="🔢 เลขที่"
>


<button
class="primary-btn"
onclick="startGame()"
>

▶️ เริ่มเกม

</button>

</div>



<!-- =========================
     หน้าเกม
========================= -->

<div
class="card game-page"
id="gamePage"
>

<h1 class="game-title">
🎮 เกมโยงเส้นจับคู่
</h1>


<div class="top-bar">

<div class="info-box">

⏱️ เวลา:
<span id="timer">00:00</span>

</div>


<div class="info-box">

🔗 โยงแล้ว:
<span id="progress">0</span> / 14

</div>

</div>



<div class="instructions">

👇 กดค้างที่
🔵 <b>จุดของแคว้น</b>

แล้วลากไปปล่อยที่

🟡 <b>จุดของคำตอบ</b>

<br>

💡 แคว้นละ 2 คำตอบ

</div>



<div
class="game-board"
id="gameBoard"
>


<!-- พื้นที่วาดเส้น -->

<svg id="svgLines"></svg>



<!-- ฝั่งซ้าย -->

<div class="column">

<h2>
🏛️ แคว้น
</h2>

<div id="kingdomList"></div>

</div>



<!-- ฝั่งขวา -->

<div class="column">

<h2>
🧩 คำตอบ
</h2>

<div id="answerList"></div>

</div>


</div>



<div class="controls">


<button
class="clear-btn"
onclick="clearLines()"
>

🗑️ ล้างเส้นทั้งหมด

</button>



<button
class="submit-btn"
onclick="submitGame()"
>

📤 ส่งคำตอบ

</button>


</div>

</div>



<!-- =========================
     หน้าผลลัพธ์
========================= -->

<div
class="card result-page"
id="resultPage"
>

<h1>
🎉 ทำเกมเสร็จแล้ว!
</h1>


<h2 id="resultName"></h2>


<div
class="score"
id="scoreText"
></div>


<p id="timeText"></p>


<p id="saveStatus">
⏳ กำลังส่งคะแนนให้ครู...
</p>


<button
class="primary-btn"
onclick="location.reload()"
>

🔄 เล่นใหม่

</button>


</div>


</div>



<script>

/* =====================================
   🔗 Google Sheets
===================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn1YvetTuJpB8zmcdUhspvxBMR1JOBO-dsHHCDhfxMbbeIIZF-VEGQGpH6kCoW5pn4OA/exec";


/* =====================================
   🏛️ ข้อมูลแคว้น
===================================== */

const kingdoms = [

"ทวารวดี",

"ละโว้",

"ลังกาสุกะ",

"ศรีวิชัย",

"ตามพรลิงค์",

"โคตรบูรณ์",

"หริภุญชัย"

];


/* =====================================
   🧩 คำตอบ
===================================== */

const answers = [

"พระธาตุพนม",

"เมืองโบราณบ้านจาเละ",

"ธรรมจักรศิลากับกวางหมอบ",

"พระปรางค์สามยอด",

"วัดจามเทวี",

"พระบรมธาตุเจดีย์ จังหวัดนครศรีธรรมราช",

"พระบรมธาตุไชยา",

"จังหวัดลำพูน",

"จังหวัดนครศรีธรรมราช",

"จังหวัดนครพนม",

"จังหวัดสุราษฎร์ธานี",

"จังหวัดปัตตานี",

"จังหวัดลพบุรี",

"จังหวัดนครปฐม"

];


/* =====================================
   ✅ คำตอบที่ถูก
===================================== */

const correctAnswers = {

"ทวารวดี": [

"ธรรมจักรศิลากับกวางหมอบ",

"จังหวัดนครปฐม"

],


"ละโว้": [

"พระปรางค์สามยอด",

"จังหวัดลพบุรี"

],


"ลังกาสุกะ": [

"เมืองโบราณบ้านจาเละ",

"จังหวัดปัตตานี"

],


"ศรีวิชัย": [

"พระบรมธาตุไชยา",

"จังหวัดสุราษฎร์ธานี"

],


"ตามพรลิงค์": [

"พระบรมธาตุเจดีย์ จังหวัดนครศรีธรรมราช",

"จังหวัดนครศรีธรรมราช"

],


"โคตรบูรณ์": [

"พระธาตุพนม",

"จังหวัดนครพนม"

],


"หริภุญชัย": [

"วัดจามเทวี",

"จังหวัดลำพูน"

]

};


/* =====================================
   🎮 ตัวแปรเกม
===================================== */

let connections = [];

let startKingdom = null;

let isDragging = false;

let tempLine = null;

let activePointerId = null;


/* =====================================
   ⏱️ ตัวจับเวลา
===================================== */

let seconds = 0;

let timerInterval = null;


/* =====================================
   🔀 สุ่มคำตอบ
===================================== */

function shuffle(array) {

const newArray = [...array];

for (
let i = newArray.length - 1;
i > 0;
i--
) {

const j =
Math.floor(
Math.random() * (i + 1)
);

[newArray[i], newArray[j]] =
[newArray[j], newArray[i]];

}

return newArray;

}


/* =====================================
   ▶️ เริ่มเกม
===================================== */

function startGame() {

const name =
document
.getElementById("studentName")
.value
.trim();


const classroom =
document
.getElementById("studentClass")
.value
.trim();


const number =
document
.getElementById("studentNumber")
.value
.trim();


if (
!name ||
!classroom ||
!number
) {

alert(
"⚠️ กรุณากรอกชื่อ ชั้น และเลขที่ให้ครบ"
);

return;

}


/* ซ่อนหน้าแรก */

document
.getElementById("startPage")
.style.display = "none";


/* แสดงหน้าเกม */

document
.getElementById("gamePage")
.style.display = "block";


/* สร้างเกม */

renderGame();


/* เริ่มจับเวลา */

timerInterval =
setInterval(() => {

seconds++;

updateTimer();

}, 1000);

}


/* =====================================
   🖥️ สร้างรายการเกม
===================================== */

function renderGame() {

const kingdomList =
document.getElementById(
"kingdomList"
);


const answerList =
document.getElementById(
"answerList"
);


/* ล้างข้อมูลเดิม */

kingdomList.innerHTML = "";

answerList.innerHTML = "";


/* สร้างฝั่งแคว้น */

kingdoms.forEach(
kingdom => {

const item =
document.createElement("div");

item.className = "item";

item.innerHTML =

`🏛️ แคว้น${kingdom}

<div
class="connector left-dot"
data-kingdom="${kingdom}"
></div>`;

kingdomList.appendChild(item);

});


/* สุ่มคำตอบ */

const shuffledAnswers =
shuffle(answers);


/* สร้างฝั่งคำตอบ */

shuffledAnswers.forEach(
answer => {

const item =
document.createElement("div");

item.className =
"item answer-item";

item.innerHTML =

`<div
class="connector right-dot"
data-answer="${answer}"
></div>

${answer}`;

answerList.appendChild(item);

});


/* ตั้งค่าระบบลาก */

setupConnectors();

}


/* =====================================
   🔗 ตั้งค่าระบบโยงเส้น
===================================== */

function setupConnectors() {


/* จุดเริ่มต้น */

document
.querySelectorAll(".left-dot")
.forEach(dot => {

dot.addEventListener(
"pointerdown",
startConnection
);

});


/* การเคลื่อนที่ */

document.addEventListener(
"pointermove",
moveConnection
);


/* ปล่อยนิ้ว / เมาส์ */

document.addEventListener(
"pointerup",
finishConnection
);


/* ยกเลิก */

document.addEventListener(
"pointercancel",
cancelConnection
);

}


/* =====================================
   🔵 เริ่มลาก
===================================== */

function startConnection(event) {

event.preventDefault();

event.stopPropagation();


/* รับเฉพาะปุ่มหลักของเมาส์ */

if (
event.pointerType === "mouse" &&
event.button !== 0
) {
return;
}


startKingdom =
event.currentTarget.dataset.kingdom;


isDragging = true;


activePointerId =
event.pointerId;


/* สร้างเส้นชั่วคราว */

const svg =
document.getElementById(
"svgLines"
);


tempLine =
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);


tempLine.setAttribute(
"class",
"temp-line"
);


svg.appendChild(
tempLine
);


/* จุดเริ่มต้น */

const startPoint =
getPoint(
event.currentTarget
);


tempLine.setAttribute(
"x1",
startPoint.x
);


tempLine.setAttribute(
"y1",
startPoint.y
);


tempLine.setAttribute(
"x2",
startPoint.x
);


tempLine.setAttribute(
"y2",
startPoint.y
);

}


/* =====================================
   ➖ ลากเส้นตามนิ้ว
===================================== */

function moveConnection(event) {

if (
!isDragging ||
!tempLine
) {
return;
}


/* ตรวจ pointer */

if (
activePointerId !== null &&
event.pointerId !== activePointerId
) {
return;
}


const board =
document.getElementById(
"gameBoard"
);


const boardRect =
board.getBoundingClientRect();


const startDot =
document.querySelector(

`.left-dot[data-kingdom="${startKingdom}"]`

);


const startPoint =
getPoint(startDot);


/* วาดจากจุดเริ่ม */

tempLine.setAttribute(
"x1",
startPoint.x
);


tempLine.setAttribute(
"y1",
startPoint.y
);


/* ไปตำแหน่งนิ้ว */

tempLine.setAttribute(
"x2",
event.clientX -
boardRect.left
);


tempLine.setAttribute(
"y2",
event.clientY -
boardRect.top
);

}


/* =====================================
   🟡 ปล่อยบนคำตอบ
===================================== */

function finishConnection(event) {

if (!isDragging) {
return;
}


/* ตรวจ pointer */

if (
activePointerId !== null &&
event.pointerId !== activePointerId
) {
return;
}


/* หา element ที่นิ้วปล่อย */

const element =
document.elementFromPoint(

event.clientX,

event.clientY

);


/* หา right-dot */

let answerDot = null;


if (element) {

if (
element.classList &&
element.classList.contains(
"right-dot"
)
) {

answerDot = element;

}

else {

answerDot =
element.closest
? element.closest(".answer-item")
?.querySelector(".right-dot")
: null;

}

}


/* ถ้าไม่ได้ปล่อยบนคำตอบ */

if (!answerDot) {

cancelConnection();

return;

}


/* คำตอบที่เลือก */

const answer =
answerDot.dataset.answer;


/* =====================================
   🚫 ตรวจคำตอบซ้ำ
===================================== */

const answerAlreadyUsed =
connections.some(
connection =>
connection.answer === answer
);


if (answerAlreadyUsed) {

alert(
"⚠️ คำตอบนี้ถูกโยงไปแล้ว"
);

cancelConnection();

return;

}


/* =====================================
   🔢 ตรวจจำนวนคำตอบของแคว้น
===================================== */

const kingdomConnections =
connections.filter(

connection =>

connection.kingdom ===
startKingdom

);


if (
kingdomConnections.length >= 2
) {

alert(
"⚠️ แคว้นนี้โยงครบ 2 คำตอบแล้ว"
);

cancelConnection();

return;

}


/* =====================================
   💾 บันทึกการเชื่อม
===================================== */

connections.push({

kingdom:
startKingdom,

answer:
answer

});


/* ลบเส้นชั่วคราว */

cancelConnection();


/* วาดเส้นจริง */

drawLines();


/* อัปเดตจำนวน */

updateProgress();

}


/* =====================================
   ❌ ยกเลิกการลาก
===================================== */

function cancelConnection() {

if (tempLine) {

tempLine.remove();

tempLine = null;

}


isDragging = false;

startKingdom = null;

activePointerId = null;

}


/* =====================================
   📍 หาตำแหน่งจุด
===================================== */

function getPoint(element) {

const board =
document.getElementById(
"gameBoard"
);


const boardRect =
board.getBoundingClientRect();


const rect =
element.getBoundingClientRect();


return {

x:

rect.left
-
boardRect.left
+
(rect.width / 2),


y:

rect.top
-
boardRect.top
+
(rect.height / 2)

};

}


/* =====================================
   ✏️ วาดเส้นทั้งหมด
===================================== */

function drawLines() {

const svg =
document.getElementById(
"svgLines"
);


/* ล้างเส้นเก่า */

svg.innerHTML = "";


/* วาดทุกเส้น */

connections.forEach(
connection => {


const startDot =
document.querySelector(

`.left-dot[data-kingdom="${connection.kingdom}"]`

);


const endDot =
document.querySelector(

`.right-dot[data-answer="${connection.answer}"]`

);


if (
!startDot ||
!endDot
) {
return;
}


const startPoint =
getPoint(startDot);


const endPoint =
getPoint(endDot);


const line =
document.createElementNS(

"http://www.w3.org/2000/svg",

"line"

);


/* จุดเริ่ม */

line.setAttribute(
"x1",
startPoint.x
);


line.setAttribute(
"y1",
startPoint.y
);


/* จุดปลาย */

line.setAttribute(
"x2",
endPoint.x
);


line.setAttribute(
"y2",
endPoint.y
);


line.setAttribute(
"class",
"line"
);


/* เพิ่มลง SVG */

svg.appendChild(line);

});

}


/* =====================================
   📊 จำนวนเส้น
===================================== */

function updateProgress() {

document
.getElementById("progress")
.textContent =
connections.length;

}


/* =====================================
   🗑️ ล้างเส้น
===================================== */

function clearLines() {

if (
connections.length === 0
) {
return;
}


const confirmClear =
confirm(
"ต้องการล้างเส้นทั้งหมดใช่หรือไม่?"
);


if (!confirmClear) {
return;
}


/* ล้างข้อมูล */

connections = [];


/* ล้าง SVG */

drawLines();


/* อัปเดต */

updateProgress();

}


/* =====================================
   ⏱️ อัปเดตเวลา
===================================== */

function updateTimer() {

const minutes =
String(
Math.floor(seconds / 60)
).padStart(2, "0");


const secs =
String(
seconds % 60
).padStart(2, "0");


document
.getElementById("timer")
.textContent =

minutes + ":" + secs;

}


/* =====================================
   🏆 ส่งเกม
===================================== */

function submitGame() {


/* ต้องครบ 14 เส้น */

if (
connections.length !== 14
) {

alert(

"⚠️ กรุณาโยงเส้นให้ครบ 14 เส้น\n\n" +

"ตอนนี้โยงแล้ว " +

connections.length +

" / 14 เส้น"

);

return;

}


/* หยุดเวลา */

clearInterval(
timerInterval
);


/* คำนวณคะแนน */

let score = 0;


connections.forEach(
connection => {

const correct =
correctAnswers[
connection.kingdom
];


if (
correct &&
correct.includes(
connection.answer
)
) {

score++;

}

});


/* สร้างเวลา */

const minutes =
String(
Math.floor(seconds / 60)
).padStart(2, "0");


const secs =
String(
seconds % 60
).padStart(2, "0");


const time =
minutes + ":" + secs;


/* ซ่อนหน้าเกม */

document
.getElementById("gamePage")
.style.display = "none";


/* แสดงผล */

document
.getElementById("resultPage")
.style.display = "block";


/* แสดงชื่อ */

document
.getElementById("resultName")
.textContent =

"👤 " +

document
.getElementById("studentName")
.value;


/* แสดงคะแนน */

document
.getElementById("scoreText")
.textContent =

"🏆 คะแนน " +

score +

" / 14";


/* แสดงเวลา */

document
.getElementById("timeText")
.textContent =

"⏱️ ใช้เวลา " +

time;


/* ส่ง Google Sheets */

sendToGoogleSheet(
score,
time
);

}


/* =====================================
   📤 ส่ง Google Sheets
===================================== */

function sendToGoogleSheet(
score,
time
) {

const data = {


name:

document
.getElementById("studentName")
.value,


classroom:

document
.getElementById("studentClass")
.value,


number:

document
.getElementById("studentNumber")
.value,


score:

score,


total:

14,


time:

time


};


/* ส่งข้อมูล */

fetch(

GOOGLE_SCRIPT_URL,

{

method: "POST",

mode: "no-cors",

headers: {

"Content-Type":
"text/plain;charset=utf-8"

},

body:
JSON.stringify(data)

}

)

.then(() => {


document
.getElementById("saveStatus")
.textContent =

"✅ ส่งคะแนนให้ครูเรียบร้อยแล้ว";


})

.catch(() => {


document
.getElementById("saveStatus")
.textContent =

"⚠️ มีปัญหาในการส่งคะแนน";


});

}


/* =====================================
   📱 เมื่อหมุนหน้าจอ
===================================== */

window.addEventListener(
"resize",
() => {

if (
connections.length > 0
) {

drawLines();

}

}
);

</script>

</body>
</html>
