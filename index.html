<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>เกมโยงเส้นจับคู่แคว้นโบราณ</title>

<style>

/* =========================
   🎨 พื้นฐาน
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:auto;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  color:#3d2b1f;

  background:
    radial-gradient(circle at top left,rgba(255,220,130,.55),transparent 35%),
    radial-gradient(circle at bottom right,rgba(160,110,55,.22),transparent 40%),
    linear-gradient(135deg,#e7d2a0,#f8edcf,#d9bd7c);

  min-height:100vh;
}

body.dragging{
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:none;
}

/* =========================
   📦 กล่องหลัก
========================= */

.container{
  width:100%;
  max-width:1900px;
  margin:auto;
  padding:25px;
}

.card{
  background:linear-gradient(
    135deg,
    rgba(255,252,237,.97),
    rgba(245,232,195,.97)
  );

  border:3px solid #b8904b;
  border-radius:28px;
  padding:30px;

  box-shadow:
    0 12px 35px rgba(70,40,15,.28),
    inset 0 0 35px rgba(160,110,45,.12);
}

/* =========================
   🏁 หน้าเริ่ม
========================= */

#startPage{
  max-width:650px;
  margin:50px auto;
}

.main-title{
  text-align:center;
  font-size:38px;
  color:#68401d;
  margin:0 0 10px;
}

.subtitle{
  text-align:center;
  color:#765d43;
  font-size:18px;
  line-height:1.7;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:16px 18px;
  margin-bottom:15px;

  border:2px solid #c6a45d;
  border-radius:14px;

  background:#fffdf4;
  font-size:18px;
}

/* =========================
   🔘 ปุ่ม
========================= */

button{
  border:none;
  border-radius:14px;
  padding:16px 20px;

  font-size:18px;
  font-weight:bold;

  cursor:pointer;
}

.primary-btn{
  width:100%;
  background:linear-gradient(135deg,#7b4f27,#a87532);
  color:white;
}

/* =========================
   🎮 เกม
========================= */

.game-page,
.result-page{
  display:none;
}

.game-header{
  text-align:center;
  margin-bottom:20px;
}

.game-title{
  margin:0;
  font-size:38px;
  color:#68401d;
}

.part-badge{
  display:inline-block;
  margin-top:12px;
  padding:10px 22px;

  border-radius:30px;

  background:#7b4f27;
  color:white;

  font-weight:bold;
  font-size:18px;
}

/* =========================
   📊 ข้อมูล
========================= */

.top-bar{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin:25px 0;
}

.info-box{
  flex:1;
  text-align:center;

  padding:17px;
  border-radius:18px;

  background:#fff8df;
  border:2px solid #d0ad64;

  font-size:19px;
  font-weight:bold;
}

/* =========================
   💡 คำแนะนำ
========================= */

.instructions{
  text-align:center;

  padding:20px;
  margin-bottom:25px;

  border-radius:20px;

  background:#edf3e8;
  border:2px solid #9cac91;

  font-size:18px;
  line-height:1.8;
}

/* =========================
   🗺️ กระดานเกม
========================= */

.game-board{
  position:relative;

  display:grid;

  grid-template-columns:
    minmax(250px,1fr)
    570px
    minmax(250px,1fr);

  width:100%;
  min-height:900px;

  margin-top:15px;
}

/* =========================
   ➖ SVG
========================= */

#svgLines{
  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  z-index:5;

  pointer-events:none;
  overflow:visible;
}

/* =========================
   📋 คอลัมน์
========================= */

.column{
  position:relative;
  z-index:10;
}

.left-column{
  grid-column:1;
}

.right-column{
  grid-column:3;
}

.column h2{
  text-align:center;
  font-size:27px;
  color:#68401d;
  margin:10px 0 30px;
}

/* =========================
   📦 รายการ
========================= */

#kingdomList,
#answerList{
  height:780px;

  display:flex;
  flex-direction:column;

  justify-content:space-between;
}

/* =========================
   🏛️ กล่อง
========================= */

.item{
  position:relative;

  min-height:80px;

  display:flex;
  align-items:center;

  padding:
    18px
    65px
    18px
    25px;

  border-radius:20px;

  font-size:20px;
  font-weight:bold;

  background:linear-gradient(
    135deg,
    #c8d5dc,
    #e4edf0
  );

  border:2px solid #9aabb1;

  color:#34444c;

  box-shadow:
    0 7px 15px rgba(40,55,60,.18);
}

.answer-item{
  padding:
    15px
    25px
    15px
    65px;

  font-size:17px;

  background:linear-gradient(
    135deg,
    #f7dfa0,
    #fff6d8
  );

  border-color:#d1aa4e;

  color:#65431d;
}

/* =========================
   🔵 🟡 จุดโยง
========================= */

.connector{

  position:absolute;

  width:48px;
  height:48px;

  border-radius:50%;

  top:50%;
  transform:translateY(-50%);

  border:5px solid #fffdf3;

  box-shadow:
    0 4px 12px rgba(0,0,0,.35);

  z-index:50;

  cursor:grab;

  /* สำคัญมากสำหรับมือถือ */
  touch-action:none;

  -webkit-user-select:none;
  user-select:none;

}

.connector:active{
  cursor:grabbing;
}

.left-dot{
  right:-24px;

  background:radial-gradient(
    circle at 35% 30%,
    #70b5df,
    #17618f
  );
}

.right-dot{
  left:-24px;

  background:radial-gradient(
    circle at 35% 30%,
    #ffd85d,
    #c58300
  );
}

/* =========================
   ➖ เส้น
========================= */

.line{
  stroke:#b8482f;
  stroke-width:7;
  stroke-linecap:round;

  filter:drop-shadow(
    0 3px 2px rgba(60,20,10,.25)
  );
}

.temp-line{
  stroke:#72512f;
  stroke-width:7;

  stroke-linecap:round;

  stroke-dasharray:14 9;

  opacity:.9;
}

/* =========================
   ✨ เชื่อมแล้ว
========================= */

.item.connected{
  box-shadow:
    0 0 0 5px rgba(86,138,84,.32),
    0 7px 15px rgba(40,55,60,.18);
}

/* =========================
   🎮 ปุ่ม
========================= */

.controls{
  display:flex;
  gap:15px;
  margin-top:30px;
}

.controls button{
  flex:1;
}

.undo-btn{
  background:#f1c45c;
  color:#493117;
}

.clear-btn{
  background:#d95c4c;
  color:white;
}

.next-btn{
  background:#79a567;
  color:white;
}

/* =========================
   🏆 ผลคะแนน
========================= */

.result-page{
  max-width:700px;
  margin:50px auto;
  text-align:center;
}

.score{
  font-size:58px;
  font-weight:bold;
  color:#a56817;
  margin:25px 0;
}

.result-info{
  font-size:20px;
  line-height:1.8;
}

/* =========================
   📱 มือถือ
========================= */

@media(max-width:700px){

  .container{
    padding:6px;
  }

  .card{
    padding:12px;
    border-radius:18px;
  }

  .main-title,
  .game-title{
    font-size:25px;
  }

  .top-bar{
    flex-direction:column;
    gap:10px;
  }

  .info-box{
    font-size:16px;
    padding:12px;
  }

  .instructions{
    font-size:14px;
    padding:14px;
  }

  .game-board{

    grid-template-columns:
      40%
      20%
      40%;

    min-height:820px;
  }

  #kingdomList,
  #answerList{
    height:740px;
  }

  .column h2{
    font-size:16px;
    margin-bottom:20px;
  }

  .item{

    min-height:75px;

    font-size:12px;

    padding:
      10px
      35px
      10px
      8px;
  }

  .answer-item{
    font-size:11px;
    padding-left:35px;
  }

  /* จุดใหญ่ขึ้นสำหรับนิ้ว */
  .connector{

    width:58px;
    height:58px;

    border-width:5px;
  }

  .left-dot{
    right:-29px;
  }

  .right-dot{
    left:-29px;
  }

  .controls{
    flex-direction:column;
  }

  .line{
    stroke-width:6;
  }

}

</style>
</head>


<body>

<div class="container">


<!-- =========================
     🏁 START
========================= -->

<div class="card" id="startPage">

<h1 class="main-title">
🏛️ เกมโยงเส้นจับคู่แคว้นโบราณ
</h1>

<p class="subtitle">
📚 เรียนรู้แคว้นโบราณในดินแดนไทย<br>
🎯 ทำทั้งหมด 2 พาร์ท
</p>

<input id="studentName"
placeholder="👤 ชื่อ-นามสกุล">

<input id="studentClass"
placeholder="🏫 ชั้น เช่น ม.1/1">

<input id="studentNumber"
placeholder="🔢 เลขที่">

<button
class="primary-btn"
onclick="startGame()">

🚀 เริ่มเกม

</button>

</div>


<!-- =========================
     🎮 GAME
========================= -->

<div class="card game-page" id="gamePage">

<div class="game-header">

<h1 class="game-title">
🏛️ เกมโยงเส้นจับคู่แคว้นโบราณ
</h1>

<div class="part-badge" id="partTitle"></div>

</div>


<div class="top-bar">

<div class="info-box">
⏱️ เวลา:
<span id="timer">00:00</span>
</div>

<div class="info-box">
🔗 พาร์ทนี้:
<span id="progress">0</span> / 7
</div>

</div>


<div class="instructions" id="instructions"></div>


<div class="game-board" id="gameBoard">

<svg id="svgLines"></svg>


<div class="column left-column">

<h2>🏛️ แคว้น</h2>

<div id="kingdomList"></div>

</div>


<div class="column right-column">

<h2 id="rightTitle">🧩 คำตอบ</h2>

<div id="answerList"></div>

</div>

</div>


<div class="controls">

<button class="undo-btn"
onclick="undoLast()">
↩️ ย้อนกลับ 1 เส้น
</button>

<button class="clear-btn"
onclick="clearLines()">
🗑️ ล้างทั้งหมด
</button>

<button class="next-btn"
id="nextButton"
onclick="nextPart()">
➡️ ไปพาร์ทที่ 2
</button>

</div>

</div>


<!-- =========================
     🏆 RESULT
========================= -->

<div class="card result-page" id="resultPage">

<h1>🏆 ผลการทำเกม</h1>

<h2 id="resultName"></h2>

<div class="score" id="scoreText"></div>

<div class="result-info"
id="partScoreText"></div>

<div class="result-info"
id="timeText"></div>

<div class="result-info"
id="saveStatus">

⏳ กำลังบันทึกคะแนน...

</div>

<br>

<button
class="primary-btn"
onclick="location.reload()">

🔄 เล่นใหม่

</button>

</div>

</div>


<script>

/* =========================
   📊 GOOGLE SHEETS
========================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn1YvetTuJpB8zmcdUhspvxBMR1JOBO-dsHHCDhfxMbbeIIZF-VEGQGpH6kCoW5pn4OA/exec";


/* =========================
   🏛️ DATA
========================= */

const kingdoms = [

"ทวารวดี",
"ละโว้",
"ลังกาสุกะ",
"ศรีวิชัย",
"ตามพรลิงค์",
"โคตรบูรณ์",
"หริภุญชัย"

];


const part1={

title:"🏛️ พาร์ทที่ 1 : แคว้นกับสถานที่สำคัญ",

rightTitle:"📍 สถานที่สำคัญ",

answers:[

"ธรรมจักรศิลากับกวางหมอบ",
"พระปรางค์สามยอด",
"เมืองโบราณบ้านจาเละ",
"พระบรมธาตุไชยา",
"พระบรมธาตุเจดีย์ จังหวัดนครศรีธรรมราช",
"พระธาตุพนม",
"วัดจามเทวี"

],

correct:{

"ทวารวดี":"ธรรมจักรศิลากับกวางหมอบ",
"ละโว้":"พระปรางค์สามยอด",
"ลังกาสุกะ":"เมืองโบราณบ้านจาเละ",
"ศรีวิชัย":"พระบรมธาตุไชยา",
"ตามพรลิงค์":"พระบรมธาตุเจดีย์ จังหวัดนครศรีธรรมราช",
"โคตรบูรณ์":"พระธาตุพนม",
"หริภุญชัย":"วัดจามเทวี"

}

};


const part2={

title:"📍 พาร์ทที่ 2 : แคว้นกับศูนย์กลางอาณาจักร",

rightTitle:"🗺️ ศูนย์กลางอาณาจักร",

answers:[

"จังหวัดนครปฐม",
"จังหวัดลพบุรี",
"จังหวัดปัตตานี",
"จังหวัดสุราษฎร์ธานี",
"จังหวัดนครศรีธรรมราช",
"จังหวัดนครพนม",
"จังหวัดลำพูน"

],

correct:{

"ทวารวดี":"จังหวัดนครปฐม",
"ละโว้":"จังหวัดลพบุรี",
"ลังกาสุกะ":"จังหวัดปัตตานี",
"ศรีวิชัย":"จังหวัดสุราษฎร์ธานี",
"ตามพรลิงค์":"จังหวัดนครศรีธรรมราช",
"โคตรบูรณ์":"จังหวัดนครพนม",
"หริภุญชัย":"จังหวัดลำพูน"

}

};


/* =========================
   🎮 VARIABLES
========================= */

let currentPart=1;

let connections=[];

let part1Connections=[];
let part2Connections=[];

let startKingdom=null;

let isDragging=false;

let tempLine=null;

let activePointerId=null;

let dragStartElement=null;

let seconds=0;

let timerInterval=null;

let pointerX=0;
let pointerY=0;

let autoScrollFrame=null;


/* =========================
   🔀 SHUFFLE
========================= */

function shuffle(array){

  let arr=[...array];

  for(let i=arr.length-1;i>0;i--){

    let j=Math.floor(Math.random()*(i+1));

    [arr[i],arr[j]]=[arr[j],arr[i]];

  }

  return arr;

}


/* =========================
   🚀 START GAME
========================= */

function startGame(){

  const name=
  document.getElementById("studentName").value.trim();

  const classroom=
  document.getElementById("studentClass").value.trim();

  const number=
  document.getElementById("studentNumber").value.trim();


  if(!name||!classroom||!number){

    alert("⚠️ กรุณากรอกข้อมูลให้ครบ");

    return;

  }


  document.getElementById("startPage").style.display="none";

  document.getElementById("gamePage").style.display="block";


  loadPart(1);


  timerInterval=setInterval(()=>{

    seconds++;

    updateTimer();

  },1000);

}


/* =========================
   📖 LOAD PART
========================= */

function loadPart(number){

  currentPart=number;

  connections=[];


  const data=
  currentPart===1?part1:part2;


  document.getElementById("partTitle").textContent=data.title;

  document.getElementById("rightTitle").textContent=data.rightTitle;


  document.getElementById("instructions").innerHTML=

  currentPart===1

  ?

  "👆 <b>แตะค้างที่วงกลมสีน้ำเงิน</b> แล้วลากไปยังคำตอบที่ถูกต้อง<br>📱 สามารถลากไปชิดขอบบนหรือขอบล่างเพื่อเลื่อนหน้าจอได้"

  :

  "👆 <b>แตะค้างที่วงกลมสีน้ำเงิน</b> แล้วลากไปยังจังหวัดที่ถูกต้อง<br>🏆 ทำครบทั้ง 7 ข้อ แล้วส่งคะแนน";


  document.getElementById("progress").textContent="0";


  document.getElementById("nextButton").textContent=

  currentPart===1

  ?"➡️ ไปพาร์ทที่ 2"

  :"🏆 ตรวจคำตอบและส่งคะแนน";


  renderGame(data);


  window.scrollTo(0,0);

}


/* =========================
   🏗️ RENDER
========================= */

function renderGame(data){

  const kingdomList=
  document.getElementById("kingdomList");

  const answerList=
  document.getElementById("answerList");

  const svg=
  document.getElementById("svgLines");


  kingdomList.innerHTML="";
  answerList.innerHTML="";
  svg.innerHTML="";


  kingdoms.forEach(kingdom=>{

    const item=document.createElement("div");

    item.className="item";

    item.dataset.kingdomItem=kingdom;

    item.innerHTML=`

      🏛️ แคว้น${kingdom}

      <div
      class="connector left-dot"
      data-kingdom="${kingdom}">
      </div>

    `;

    kingdomList.appendChild(item);

  });


  shuffle(data.answers).forEach(answer=>{

    const item=document.createElement("div");

    item.className="item answer-item";

    item.dataset.answerItem=answer;

    item.innerHTML=`

      <div
      class="connector right-dot"
      data-answer="${answer}">
      </div>

      ${answer}

    `;

    answerList.appendChild(item);

  });


  setupConnectors();

}


/* =========================
   🔗 CONNECTORS
========================= */

function setupConnectors(){

  document
  .querySelectorAll(".left-dot")
  .forEach(dot=>{

    dot.addEventListener(
      "pointerdown",
      startConnection
    );

  });

}


/* =========================
   🔵 START DRAG
========================= */

function startConnection(event){

  if(event.button!==0 && event.pointerType==="mouse"){
    return;
  }


  event.preventDefault();


  const kingdom=
  event.currentTarget.dataset.kingdom;


  if(
    connections.some(c=>c.kingdom===kingdom)
  ){

    alert("⚠️ แคว้นนี้ถูกเชื่อมแล้ว");

    return;

  }


  startKingdom=kingdom;

  isDragging=true;

  activePointerId=event.pointerId;

  dragStartElement=event.currentTarget;


  pointerX=event.clientX;
  pointerY=event.clientY;


  /* 🔥 ล็อกนิ้ว */

  try{

    dragStartElement.setPointerCapture(
      activePointerId
    );

  }catch(e){}


  document.body.classList.add("dragging");


  const svg=
  document.getElementById("svgLines");


  tempLine=
  document.createElementNS(
    "http://www.w3.org/2000/svg",
    "line"
  );


  tempLine.setAttribute(
    "class",
    "temp-line"
  );


  svg.appendChild(tempLine);


  updateTempLine();


  startAutoScroll();

}


/* =========================
   👆 MOVE
========================= */

document.addEventListener(
"pointermove",
function(event){

  if(!isDragging)return;

  if(event.pointerId!==activePointerId)return;


  event.preventDefault();


  pointerX=event.clientX;
  pointerY=event.clientY;


  updateTempLine();

},
{passive:false}
);


/* =========================
   ➖ TEMP LINE
========================= */

function updateTempLine(){

  if(!tempLine)return;


  const board=
  document.getElementById("gameBoard");

  const rect=
  board.getBoundingClientRect();


  const startDot=
  document.querySelector(
  `.left-dot[data-kingdom="${startKingdom}"]`
  );


  if(!startDot)return;


  const start=
  getPoint(startDot);


  tempLine.setAttribute("x1",start.x);

  tempLine.setAttribute("y1",start.y);

  tempLine.setAttribute(
    "x2",
    pointerX-rect.left
  );

  tempLine.setAttribute(
    "y2",
    pointerY-rect.top
  );

}


/* =========================
   📱 AUTO SCROLL
========================= */

function startAutoScroll(){

  if(autoScrollFrame)return;


  function loop(){

    if(!isDragging){

      autoScrollFrame=null;

      return;

    }


    const zone=90;

    let speed=0;


    if(pointerY>window.innerHeight-zone){

      const distance=
      pointerY-(window.innerHeight-zone);

      speed=
      Math.min(12,distance/4);

    }

    else if(pointerY<zone){

      const distance=
      zone-pointerY;

      speed=
      -Math.min(12,distance/4);

    }


    if(speed!==0){

      window.scrollBy(0,speed);

      updateTempLine();

    }


    autoScrollFrame=
    requestAnimationFrame(loop);

  }


  autoScrollFrame=
  requestAnimationFrame(loop);

}


/* =========================
   🟡 FINISH
========================= */

document.addEventListener(
"pointerup",
function(event){

  if(!isDragging)return;

  if(event.pointerId!==activePointerId)return;


  finishConnection(event);

}
);


/* =========================
   🎯 FIND ANSWER
========================= */

function finishConnection(event){

  let element=
  document.elementFromPoint(
    event.clientX,
    event.clientY
  );


  let answerItem=null;


  if(element){

    answerItem=
    element.closest(".answer-item");

  }


  if(!answerItem){

    cancelConnection();

    return;

  }


  const answer=
  answerItem.dataset.answerItem;


  if(
    connections.some(c=>c.answer===answer)
  ){

    alert("⚠️ คำตอบนี้ถูกใช้แล้ว");

    cancelConnection();

    return;

  }


  connections.push({

    kingdom:startKingdom,

    answer:answer

  });


  cancelConnection();

  drawLines();

  updateProgress();

  updateConnectedStatus();

}


/* =========================
   ❌ CANCEL
========================= */

function cancelConnection(){

  if(tempLine){

    tempLine.remove();

    tempLine=null;

  }


  if(
    dragStartElement &&
    activePointerId!==null
  ){

    try{

      if(
        dragStartElement.hasPointerCapture(
          activePointerId
        )
      ){

        dragStartElement.releasePointerCapture(
          activePointerId
        );

      }

    }catch(e){}

  }


  isDragging=false;

  startKingdom=null;

  activePointerId=null;

  dragStartElement=null;


  document.body.classList.remove("dragging");

}


/* =========================
   📍 POINT
========================= */

function getPoint(element){

  const board=
  document.getElementById("gameBoard");

  const boardRect=
  board.getBoundingClientRect();

  const rect=
  element.getBoundingClientRect();


  return{

    x:
    rect.left-boardRect.left+
    rect.width/2,

    y:
    rect.top-boardRect.top+
    rect.height/2

  };

}


/* =========================
   ✏️ DRAW LINES
========================= */

function drawLines(){

  const svg=
  document.getElementById("svgLines");


  svg.innerHTML="";


  connections.forEach(connection=>{

    const startDot=
    document.querySelector(
    `.left-dot[data-kingdom="${connection.kingdom}"]`
    );


    const endDot=
    document.querySelector(
    `.right-dot[data-answer="${connection.answer}"]`
    );


    if(!startDot||!endDot)return;


    const start=
    getPoint(startDot);

    const end=
    getPoint(endDot);


    const line=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );


    line.setAttribute("x1",start.x);
    line.setAttribute("y1",start.y);

    line.setAttribute("x2",end.x);
    line.setAttribute("y2",end.y);


    line.setAttribute("class","line");


    svg.appendChild(line);

  });

}


/* =========================
   ✨ STATUS
========================= */

function updateConnectedStatus(){

  document
  .querySelectorAll(".item")
  .forEach(item=>{

    item.classList.remove("connected");

  });


  connections.forEach(c=>{

    const kingdomItem=
    document.querySelector(
    `[data-kingdom-item="${c.kingdom}"]`
    );


    const answerItem=
    document.querySelector(
    `[data-answer-item="${c.answer}"]`
    );


    if(kingdomItem)
      kingdomItem.classList.add("connected");


    if(answerItem)
      answerItem.classList.add("connected");

  });

}


/* =========================
   📊 PROGRESS
========================= */

function updateProgress(){

  document
  .getElementById("progress")
  .textContent=connections.length;

}


/* =========================
   ↩️ UNDO
========================= */

function undoLast(){

  if(connections.length===0){

    alert("ยังไม่มีเส้น");

    return;

  }


  connections.pop();

  drawLines();

  updateProgress();

  updateConnectedStatus();

}


/* =========================
   🗑️ CLEAR
========================= */

function clearLines(){

  if(connections.length===0)return;


  if(!confirm("ต้องการล้างทั้งหมดใช่หรือไม่?"))
  return;


  connections=[];

  drawLines();

  updateProgress();

  updateConnectedStatus();

}


/* =========================
   ➡️ NEXT
========================= */

function nextPart(){

  if(connections.length!==7){

    alert(
    "⚠️ กรุณาเชื่อมให้ครบ 7 ข้อก่อน\n\n"+
    "ตอนนี้: "+connections.length+"/7"
    );

    return;

  }


  if(currentPart===1){

    part1Connections=[...connections];

    loadPart(2);

    return;

  }


  part2Connections=[...connections];

  submitGame();

}


/* =========================
   ⏱️ TIMER
========================= */

function updateTimer(){

  const min=
  String(Math.floor(seconds/60))
  .padStart(2,"0");

  const sec=
  String(seconds%60)
  .padStart(2,"0");


  document.getElementById("timer")
  .textContent=min+":"+sec;

}


/* =========================
   🏆 SCORE
========================= */

function submitGame(){

  clearInterval(timerInterval);


  let score1=0;

  let score2=0;


  part1Connections.forEach(c=>{

    if(
      part1.correct[c.kingdom]===c.answer
    ){

      score1++;

    }

  });


  part2Connections.forEach(c=>{

    if(
      part2.correct[c.kingdom]===c.answer
    ){

      score2++;

    }

  });


  const total=score1+score2;


  const time=

  String(Math.floor(seconds/60))
  .padStart(2,"0")

  +":"

  +

  String(seconds%60)
  .padStart(2,"0");


  document.getElementById("gamePage")
  .style.display="none";


  document.getElementById("resultPage")
  .style.display="block";


  document.getElementById("resultName")
  .textContent=

  "👤 "+
  document.getElementById("studentName").value;


  document.getElementById("scoreText")
  .textContent=

  total+" / 14 คะแนน";


  document.getElementById("partScoreText")
  .innerHTML=

  "🏛️ พาร์ทที่ 1: <b>"+
  score1+" / 7</b><br>"

  +

  "📍 พาร์ทที่ 2: <b>"+
  score2+" / 7</b>";


  document.getElementById("timeText")
  .textContent=

  "⏱️ ใช้เวลา "+time;


  sendToGoogleSheet(
    total,
    score1,
    score2,
    time
  );

}


/* =========================
   📤 SEND SHEETS
========================= */

function sendToGoogleSheet(
total,
score1,
score2,
time
){

  const data={

    name:
    document.getElementById("studentName").value,

    classroom:
    document.getElementById("studentClass").value,

    number:
    document.getElementById("studentNumber").value,

    part1Score:score1,

    part2Score:score2,

    score:total,

    total:14,

    time:time

  };


  fetch(
    GOOGLE_SCRIPT_URL,
    {

      method:"POST",

      mode:"no-cors",

      headers:{
        "Content-Type":
        "text/plain;charset=utf-8"
      },

      body:JSON.stringify(data)

    }
  )

  .then(()=>{

    document
    .getElementById("saveStatus")
    .textContent=
    "✅ ส่งคะแนนเรียบร้อยแล้ว";

  })

  .catch(()=>{

    document
    .getElementById("saveStatus")
    .textContent=
    "⚠️ ส่งคะแนนไม่สำเร็จ";

  });

}


/* =========================
   📱 RESIZE / SCROLL
========================= */

window.addEventListener(
"resize",
function(){

  if(connections.length>0){

    drawLines();

  }

}
);


window.addEventListener(
"scroll",
function(){

  if(connections.length>0){

    drawLines();

  }


  if(isDragging){

    updateTempLine();

  }

},
{passive:true}
);


</script>
