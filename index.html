<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เกมโยงเส้นจับคู่แคว้นโบราณ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background: linear-gradient(135deg, #f5e6bd, #d9ead3);
  color: #333;
}

.container {
  max-width: 1250px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #666;
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 2px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px 20px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.primary-btn {
  width: 100%;
  margin-top: 15px;
  background: #4f7d45;
  color: white;
}

.game-page,
.result-page {
  display: none;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.info-box {
  background: #fff3cd;
  padding: 12px 20px;
  border-radius: 12px;
  font-weight: bold;
}

.instructions {
  text-align: center;
  background: #e7f3ff;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.game-board {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 70px;
  min-height: 650px;
}

.column {
  position: relative;
  z-index: 2;
}

.column h2 {
  text-align: center;
}

.item {
  position: relative;
  background: #e5f0fa;
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 15px;
  min-height: 65px;
  display: flex;
  align-items: center;
  font-weight: bold;
  box-shadow: 0 3px 8px rgba(0,0,0,.08);
}

.answer-item {
  background: #fff4cc;
}

.connector {
  position: absolute;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  top: 50%;
  transform: translateY(-50%);
  cursor: crosshair;
  border: 4px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
  z-index: 5;
}

.left-dot {
  right: -12px;
  background: #3976a3;
}

.right-dot {
  left: -12px;
  background: #d69e00;
}

.item.connected {
  outline: 3px solid #4f9b55;
}

svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.line {
  stroke: #e05a47;
  stroke-width: 5;
  stroke-linecap: round;
}

.temp-line {
  stroke: #777;
  stroke-width: 4;
  stroke-dasharray: 8 6;
  stroke-linecap: round;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.controls button {
  flex: 1;
}

.clear-btn {
  background: #d9534f;
  color: white;
}

.submit-btn {
  background: #4f7d45;
  color: white;
}

.result-page {
  text-align: center;
}

.score {
  font-size: 42px;
  font-weight: bold;
}

@media (max-width: 800px) {

  .game-board {
    grid-template-columns: 1fr 1fr;
    gap: 45px;
    min-height: 850px;
  }

  .item {
    font-size: 14px;
    padding: 12px;
    min-height: 70px;
  }

  .answers-column .item {
    margin-bottom: 10px;
  }

  .connector {
    width: 22px;
    height: 22px;
  }

}

</style>
</head>

<body>

<div class="container">

<!-- หน้าเริ่มต้น -->

<div class="card" id="startPage">

<h1>🏛️ เกมโยงเส้นจับคู่แคว้นโบราณ</h1>

<p class="subtitle">
โยงเส้นจับคู่แคว้นกับหลักฐานและจังหวัดให้ถูกต้อง
</p>

<input id="studentName" placeholder="👤 ชื่อ-นามสกุล">

<input id="studentClass" placeholder="🏫 ชั้น เช่น ม.1/1">

<input id="studentNumber" placeholder="🔢 เลขที่">

<button class="primary-btn" onclick="startGame()">
▶️ เริ่มเกม
</button>

</div>


<!-- หน้าเกม -->

<div class="card game-page" id="gamePage">

<h1>🎮 เกมโยงเส้นจับคู่</h1>

<div class="top-bar">

<div class="info-box">
⏱️ เวลา: <span id="timer">00:00</span>
</div>

<div class="info-box">
🔗 โยงแล้ว: <span id="progress">0</span> / 14
</div>

</div>

<div class="instructions">
👆 กดค้างที่จุด 🔵 ของแคว้น แล้วลากไปปล่อยที่จุด 🟡 ของคำตอบ
<br>
💡 แต่ละแคว้นต้องโยงได้ 2 คำตอบ
</div>

<div class="game-board" id="gameBoard">

<svg id="svgLines"></svg>

<div class="column kingdoms-column">

<h2>🏛️ แคว้น</h2>

<div id="kingdomList"></div>

</div>


<div class="column answers-column">

<h2>🧩 คำตอบ</h2>

<div id="answerList"></div>

</div>

</div>

<div class="controls">

<button class="clear-btn" onclick="clearLines()">
🗑️ ล้างเส้นทั้งหมด
</button>

<button class="submit-btn" onclick="submitGame()">
📤 ส่งคำตอบ
</button>

</div>

</div>


<!-- ผลลัพธ์ -->

<div class="card result-page" id="resultPage">

<h1>🎉 ทำเกมเสร็จแล้ว!</h1>

<h2 id="resultName"></h2>

<div class="score" id="scoreText"></div>

<p id="timeText"></p>

<p id="saveStatus">⏳ กำลังส่งคะแนนให้ครู...</p>

<button class="primary-btn" onclick="location.reload()">
🔄 เล่นใหม่
</button>

</div>

</div>


<script>

// =====================================
// 🔗 Google Sheets
// =====================================

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzn1YvetTuJpB8zmcdUhspvxBMR1JOBO-dsHHCDhfxMbbeIIZF-VEGQGpH6kCoW5pn4OA/exec";


// =====================================
// 🏛️ ข้อมูลเกม
// =====================================

const kingdoms = [
"ทวารวดี",
"ละโว้",
"ลังกาสุกะ",
"ศรีวิชัย",
"ตามพรลิงค์",
"โคตรบูรณ์",
"หริภุญชัย"
];

const answers = [
"พระธาตุพนม",
"เมืองโบราณบ้านจาเละ",
"ธรรมจักรศิลากับกวางหมอบ",
"พระปรางค์สามยอด",
"วัดจามเทวี",
"พระบรมธาตุเจดีย์ จังหวัดนครศรีธรรมราช",
"พระบรมธาตุไชยา",
"จังหวัดลำพูน",
"จังหวัดนครศรีธรรมราช",
"จังหวัดนครพนม",
"จังหวัดสุราษฎร์ธานี",
"จังหวัดปัตตานี",
"จังหวัดลพบุรี",
"จังหวัดนครปฐม"
];

const correctAnswers = {

"ทวารวดี": [
"ธรรมจักรศิลากับกวางหมอบ",
"จังหวัดนครปฐม"
],

"ละโว้": [
"พระปรางค์สามยอด",
"จังหวัดลพบุรี"
],

"ลังกาสุกะ": [
"เมืองโบราณบ้านจาเละ",
"จังหวัดปัตตานี"
],

"ศรีวิชัย": [
"พระบรมธาตุไชยา",
"จังหวัดสุราษฎร์ธานี"
],

"ตามพรลิงค์": [
"พระบรมธาตุเจดีย์ จังหวัดนครศรีธรรมราช",
"จังหวัดนครศรีธรรมราช"
],

"โคตรบูรณ์": [
"พระธาตุพนม",
"จังหวัดนครพนม"
],

"หริภุญชัย": [
"วัดจามเทวี",
"จังหวัดลำพูน"
]

};


// =====================================
// 🎮 ตัวแปรเกม
// =====================================

let connections = [];
let startKingdom = null;
let isDragging = false;
let tempLine = null;

let seconds = 0;
let timerInterval = null;


// =====================================
// 🔀 สุ่มคำตอบ
// =====================================

function shuffle(array) {

const newArray = [...array];

for (let i = newArray.length - 1; i > 0; i--) {

const j = Math.floor(Math.random() * (i + 1));

[newArray[i], newArray[j]] =
[newArray[j], newArray[i]];

}

return newArray;

}


// =====================================
// ▶️ เริ่มเกม
// =====================================

function startGame() {

const name = document.getElementById("studentName").value.trim();
const classroom = document.getElementById("studentClass").value.trim();
const number = document.getElementById("studentNumber").value.trim();

if (!name || !classroom || !number) {

alert("กรุณากรอกข้อมูลให้ครบ");

return;

}

document.getElementById("startPage").style.display = "none";
document.getElementById("gamePage").style.display = "block";

renderGame();

timerInterval = setInterval(() => {

seconds++;
updateTimer();

}, 1000);

}


// =====================================
// 🖥️ สร้างเกม
// =====================================

function renderGame() {

const kingdomList =
document.getElementById("kingdomList");

const answerList =
document.getElementById("answerList");

kingdomList.innerHTML = "";
answerList.innerHTML = "";


kingdoms.forEach(kingdom => {

const item = document.createElement("div");

item.className = "item";

item.innerHTML =
`🏛️ แคว้น${kingdom}
<div class="connector left-dot"
data-kingdom="${kingdom}"></div>`;

kingdomList.appendChild(item);

});


shuffle(answers).forEach(answer => {

const item = document.createElement("div");

item.className = "item answer-item";

item.innerHTML =
`<div class="connector right-dot"
data-answer="${answer}"></div>
${answer}`;

answerList.appendChild(item);

});


setupConnectors();

}


// =====================================
// 🔗 ระบบโยงเส้น
// =====================================

function setupConnectors() {

const board =
document.getElementById("gameBoard");

const svg =
document.getElementById("svgLines");


document.querySelectorAll(".left-dot")
.forEach(dot => {

dot.addEventListener("pointerdown", startConnection);

});


document.querySelectorAll(".right-dot")
.forEach(dot => {

dot.addEventListener("pointerup", endConnection);

});


board.addEventListener("pointermove", moveConnection);

board.addEventListener("pointerup", cancelConnection);

board.addEventListener("pointerleave", cancelConnection);

}


function startConnection(event) {

event.preventDefault();

startKingdom =
event.target.dataset.kingdom;

isDragging = true;


const svg =
document.getElementById("svgLines");

const line =
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.classList.add("temp-line");

svg.appendChild(line);

tempLine = line;

const point =
getPoint(event.target);

line.setAttribute("x1", point.x);
line.setAttribute("y1", point.y);
line.setAttribute("x2", point.x);
line.setAttribute("y2", point.y);

event.target.setPointerCapture(event.pointerId);

}


function moveConnection(event) {

if (!isDragging || !tempLine) return;

const board =
document.getElementById("gameBoard");

const rect =
board.getBoundingClientRect();

const startDot =
document.querySelector(
`.left-dot[data-kingdom="${startKingdom}"]`
);

const startPoint =
getPoint(startDot);


tempLine.setAttribute("x1", startPoint.x);
tempLine.setAttribute("y1", startPoint.y);

tempLine.setAttribute(
"x2",
event.clientX - rect.left
);

tempLine.setAttribute(
"y2",
event.clientY - rect.top
);

}


function endConnection(event) {

if (!isDragging) return;

event.preventDefault();

const answer =
event.target.dataset.answer;


// ตรวจคำตอบนี้ถูกโยงแล้วหรือไม่

if (
connections.some(
connection =>
connection.answer === answer
)
) {

cancelConnection();

return;

}


// แคว้นโยงได้สูงสุด 2 เส้น

const kingdomConnections =
connections.filter(
connection =>
connection.kingdom === startKingdom
);


if (kingdomConnections.length >= 2) {

alert("แคว้นนี้โยงครบ 2 คำตอบแล้ว");

cancelConnection();

return;

}


// บันทึกเส้น

connections.push({

kingdom: startKingdom,
answer: answer

});


drawLines();

cancelConnection();

updateProgress();

}


function cancelConnection() {

if (tempLine) {

tempLine.remove();

tempLine = null;

}

isDragging = false;
startKingdom = null;

}


function getPoint(element) {

const board =
document.getElementById("gameBoard");

const boardRect =
board.getBoundingClientRect();

const rect =
element.getBoundingClientRect();

return {

x:
rect.left -
boardRect.left +
rect.width / 2,

y:
rect.top -
boardRect.top +
rect.height / 2

};

}


// =====================================
// ✏️ วาดเส้นทั้งหมด
// =====================================

function drawLines() {

const svg =
document.getElementById("svgLines");

svg.innerHTML = "";


connections.forEach(connection => {

const start =
document.querySelector(
`.left-dot[data-kingdom="${connection.kingdom}"]`
);

const end =
document.querySelector(
`.right-dot[data-answer="${connection.answer}"]`
);


const startPoint =
getPoint(start);

const endPoint =
getPoint(end);


const line =
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1", startPoint.x);
line.setAttribute("y1", startPoint.y);

line.setAttribute("x2", endPoint.x);
line.setAttribute("y2", endPoint.y);

line.classList.add("line");

svg.appendChild(line);

});

}


// =====================================
// 📊 อัปเดตจำนวน
// =====================================

function updateProgress() {

document.getElementById("progress").textContent =
connections.length;

}


// =====================================
// 🗑️ ล้างเส้น
// =====================================

function clearLines() {

if (!confirm("ต้องการล้างเส้นทั้งหมดใช่หรือไม่?")) {
return;
}

connections = [];

drawLines();

updateProgress();

}


// =====================================
// ⏱️ เวลา
// =====================================

function updateTimer() {

const min =
String(Math.floor(seconds / 60))
.padStart(2, "0");

const sec =
String(seconds % 60)
.padStart(2, "0");

document.getElementById("timer").textContent =
min + ":" + sec;

}


// =====================================
// 🏆 ส่งคำตอบ
// =====================================

function submitGame() {

if (connections.length !== 14) {

alert(
"กรุณาโยงเส้นให้ครบ 14 เส้น\nตอนนี้โยงแล้ว " +
connections.length +
" เส้น"
);

return;

}

clearInterval(timerInterval);


let score = 0;


connections.forEach(connection => {

if (
correctAnswers[connection.kingdom]
.includes(connection.answer)
) {

score++;

}

});


const min =
String(Math.floor(seconds / 60))
.padStart(2, "0");

const sec =
String(seconds % 60)
.padStart(2, "0");

const time =
min + ":" + sec;


document.getElementById("gamePage").style.display =
"none";

document.getElementById("resultPage").style.display =
"block";


document.getElementById("resultName").textContent =
"👤 " +
document.getElementById("studentName").value;


document.getElementById("scoreText").textContent =
"🏆 คะแนน " +
score +
" / 14";


document.getElementById("timeText").textContent =
"⏱️ ใช้เวลา " +
time;


sendToGoogleSheet(score, time);

}


// =====================================
// 📤 ส่ง Google Sheets
// =====================================

function sendToGoogleSheet(score, time) {

const data = {

name:
document.getElementById("studentName").value,

classroom:
document.getElementById("studentClass").value,

number:
document.getElementById("studentNumber").value,

score:
score + "/14",

time:
time

};


fetch(GOOGLE_SCRIPT_URL, {

method: "POST",

mode: "no-cors",

headers: {
"Content-Type": "text/plain"
},

body:
JSON.stringify(data)

})

.then(() => {

document.getElementById("saveStatus").textContent =
"✅ ส่งคะแนนให้ครูเรียบร้อยแล้ว";

})

.catch(() => {

document.getElementById("saveStatus").textContent =
"⚠️ ไม่สามารถยืนยันการส่งคะแนนได้";

});

}


// =====================================
// 📱 วาดเส้นใหม่เมื่อหมุนหน้าจอ
// =====================================

window.addEventListener("resize", () => {

drawLines();

});

</script>

</body>
</html>
